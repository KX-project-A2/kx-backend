services:
  app:
    build:
      context: .
    image: kx-backend:local
    container_name: kx-backend-local
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DB_URL: jdbc:mysql://mysql:3306/kx_backend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: kx
      DB_PASSWORD: kx_local_password
      STORAGE_BASE_PATH: /app/storage
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      OAUTH2_REDIRECT_URI: http://localhost:3000/oauth/callback
    ports:
      - "8080:8080"
    volumes:
      - kx_storage:/app/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: kx-mysql-local
    environment:
      MYSQL_DATABASE: kx_backend
      MYSQL_USER: kx
      MYSQL_PASSWORD: kx_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - kx_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kx_mysql_data:
  kx_storage:
