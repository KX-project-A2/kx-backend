services:
  nginx:
    image: nginx:1.27-alpine
    container_name: kx-nginx
    depends_on:
      - app
    env_file:
      - ${APP_ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "
      if [ -f /etc/letsencrypt/live/$$CERTBOT_DOMAIN/fullchain.pem ] &&
         [ -f /etc/letsencrypt/live/$$CERTBOT_DOMAIN/privkey.pem ]; then
        envsubst '$$CERTBOT_DOMAIN' < /etc/nginx/templates/https.conf.template > /etc/nginx/conf.d/default.conf;
      else
        envsubst '$$CERTBOT_DOMAIN' < /etc/nginx/templates/http.conf.template > /etc/nginx/conf.d/default.conf;
      fi;
      nginx -g 'daemon off;'
      "
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: kx-certbot
    profiles:
      - certbot
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "
      test -n "$$CERTBOT_DOMAIN" || { echo 'CERTBOT_DOMAIN is required'; exit 1; };
      test -n "$$CERTBOT_EMAIL" || { echo 'CERTBOT_EMAIL is required'; exit 1; };
      certbot certonly
      --non-interactive
      --webroot
      --webroot-path /var/www/certbot
      --email "$$CERTBOT_EMAIL"
      --agree-tos
      --no-eff-email
      --keep-until-expiring
      -d "$$CERTBOT_DOMAIN"
      "

  app:
    image: ${DOCKER_IMAGE}
    container_name: kx-backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      STORAGE_BASE_PATH: /app/storage
    expose:
      - "8080"
    volumes:
      - kx_storage:/app/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: kx-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - kx_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kx_mysql_data:
  kx_storage:
