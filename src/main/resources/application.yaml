spring:
  application:
    name: kx-backend
  config:
    import: optional:file:.env.local[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

ai:
  fal:
    base-url: ${FAL_BASE_URL:https://queue.fal.run}
    api-key: ${FAL_KEY:}
