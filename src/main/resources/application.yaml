spring:
  application:
    name: kx-backend
  config:
    import: optional:file:.env.local[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com/v1
  image:
    model: gpt-image-2
    size: 1024x1024
    quality: high
  batch:
    poll-interval-ms: 60000

storage:
  local:
    base-path: ${STORAGE_BASE_PATH:./storage}

ai:
  fal:
    base-url: ${FAL_BASE_URL:https://queue.fal.run}
    api-key: ${FAL_KEY:}
