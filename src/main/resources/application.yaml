spring:
  application:
    name: kx-backend
  config:
    import: optional:file:.env.local[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com/v1
  image:
    model: gpt-image-2
    size: auto
    quality: standard
    character-sheet:
      size: 1536x864
  batch:
    poll-interval-ms: 60000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
  prompt-correction:
    model: ${ANTHROPIC_PROMPT_CORRECTION_MODEL:claude-sonnet-5}
    max-tokens: ${ANTHROPIC_PROMPT_CORRECTION_MAX_TOKENS:1200}
  reverse-prompt:
    model: ${ANTHROPIC_REVERSE_PROMPT_MODEL:claude-sonnet-5}
    max-tokens: ${ANTHROPIC_REVERSE_PROMPT_MAX_TOKENS:1200}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ${STORAGE_BASE_PATH:./storage}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presigned-url-expiration-seconds: ${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:1800}

share:
  link:
    expiration-days: ${SHARE_LINK_EXPIRATION_DAYS:7}
    token-byte-length: ${SHARE_LINK_TOKEN_BYTE_LENGTH:32}
    max-token-generation-attempts: ${SHARE_LINK_MAX_TOKEN_GENERATION_ATTEMPTS:5}
    cleanup-cron: ${SHARE_LINK_CLEANUP_CRON:0 30 3 * * *}

ai:
  fal:
    base-url: ${FAL_BASE_URL:https://queue.fal.run}
    api-key: ${FAL_KEY:}
    webhook-url: ${FAL_WEBHOOK_URL:}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
